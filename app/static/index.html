<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日序，每天一张必应壁纸。收藏世界的风景，按日期寻找值得停留的一瞬。"><title>日序 · 必应壁纸档案</title><link rel="stylesheet" href="/static/style.css"><script src="/static/gallery.js" defer></script></head>
<body class="home">
<div id="page-bg" class="page-bg" aria-hidden="true"></div>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/"><span class="brand-icon">◒</span>日序<span class="brand-sub">· 每日一图，带您领略世界之美</span></a><nav><button type="button" id="toggle-search" class="pill" aria-controls="filters">⌕ 搜索</button><a class="pill" href="#api">API</a><a class="pill pill-blue" href="/admin/">管理</a></nav></div></header>
<main class="sheet">
<section id="hero" class="hero" hidden><img id="hero-image" alt="最新收录的必应壁纸" fetchpriority="high"><div class="hero-shade"></div><div class="hero-top"><span class="glass-label">今日壁纸</span><span id="hero-date"></span></div><div class="hero-caption"><div><h2 id="hero-title"></h2><p id="hero-copyright"></p></div><button id="hero-open" class="round-button" aria-label="查看最新壁纸">↗</button></div></section>
<section id="archive" class="archive">
<div class="section-heading"><h2>壁纸档案<span id="result-count"></span></h2><p class="muted">已收录 <strong id="archive-count">—</strong> 张</p></div>
<form id="filters" class="filters"><div class="search-group"><input id="search" type="search" placeholder="请输入图片关键词" aria-label="搜索壁纸"><button type="submit" class="button">搜索</button></div><label class="month-field">按月筛选<input id="month" type="month" aria-label="按月筛选"></label><button type="button" id="reset" class="outline-button">查看全部</button></form>
<p id="message" class="state-message" role="status">正在加载壁纸…</p>
<div id="gallery" class="gallery"></div>
<div class="pagination"><button id="previous" class="outline-button">‹ 上一页</button><span id="page-info"></span><button id="next" class="outline-button">下一页 ›</button></div>
</section>
<section id="api" class="api-section"><div class="api-head"><h2>必应每日一图 API</h2><p>直接引用为网页背景：<code>&lt;img src="https://wallpaper.boyweb.net/img/" /&gt;</code></p></div><div class="api-links"><a href="/img/"><span>今日图像（预览）</span><code>/img/</code></a><a href="/img/4k"><span>今日图像（4K 原图）</span><code>/img/4k</code></a><a href="/img/rand"><span>随机图像</span><code>/img/rand</code></a><a href="/img/?type=json"><span>JSON 信息</span><code>/img/?type=json</code></a></div></section>
</main>
<footer class="foot"><p>© 日序 · 图片来源于 Bing，版权归原摄影师及权利人所有。</p><a href="#" class="to-top" aria-label="回到顶部">↑</a></footer>
<dialog id="detail"><button id="close-dialog" class="dialog-close" aria-label="关闭预览">×</button><img id="detail-image" alt="壁纸大图"><div class="detail-body"><p id="detail-date" class="detail-date"></p><h2 id="detail-title"></h2><p id="detail-copyright"></p><div class="detail-actions"><a id="download" class="button" download>下载原图 ↓</a><a id="source" target="_blank" rel="noopener noreferrer" class="outline-button">Bing 介绍 ↗</a></div></div></dialog>
</body></html>
