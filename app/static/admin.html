<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理 · 日序</title><link rel="stylesheet" href="/static/style.css"><script src="/static/admin.js" defer></script></head><body>
<header class="topbar"><a class="brand" href="/">◒ 日序<span class="brand-sub">ARCHIVE STUDIO</span></a><a href="/">返回壁纸站 ↗</a></header><main class="admin-main"><p class="eyebrow">BEHIND THE COLLECTION</p><h1>打理你的风景档案。</h1>
<form id="login-form" class="panel login-panel"><h2>管理员登录</h2><label>管理密码<input id="login-password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">登录 →</button><p id="login-message" role="status"></p></form>
<div id="dashboard" hidden><div class="admin-toolbar"><p>每日采集 · 自动归档</p><button id="logout" class="text-button">退出登录</button></div><div id="stats" class="stats"></div>
<section class="panel"><div class="section-heading"><div><h2>采集任务</h2><p class="muted">每小时检查新壁纸，自动补采 Bing 近期可提供的图片。</p></div><button id="sync" class="outline-button">立即采集与归档</button></div><p id="job-status" role="status"></p></section>
<form id="settings-form" class="panel"><div class="section-heading"><div><p class="eyebrow">STORAGE</p><h2>WebDAV 归档</h2></div><span id="storage-badge" class="badge">尚未启用</span></div><p class="muted">本地保留近期原图。超过期限的原图在远端上传、回读校验成功后，才清理本地副本。缩略图与预览图留在本地，浏览历史壁纸更快。</p>
<div class="form-grid"><label>本地原图保留天数<input id="retention_days" type="number" min="1" max="3650" value="30" required></label><label class="check-label"><input id="webdav_enabled" type="checkbox">启用 WebDAV 自动归档</label><label class="wide">WebDAV 地址<input id="webdav_url" type="url" placeholder="https://dav.example.com/dav/" autocomplete="off"></label><label class="wide">专用目录<input id="webdav_directory" placeholder="bing-wallpaper" value="bing-wallpaper" required></label><label>用户名<input id="webdav_username" autocomplete="off"></label><label>密码 / 应用密码<input id="webdav_password" type="password" autocomplete="new-password" placeholder="尚未保存密码"></label></div>
<p class="hint">测试会创建专用目录和临时文件，检查读取、写入及删除权限；不会改动已有壁纸。密码留空表示保留已保存的密码。</p><div class="form-actions"><button id="test-webdav" type="button" class="outline-button">测试连接</button><button id="save-settings" type="submit" class="button">保存配置 →</button></div><div id="test-result" role="status" class="test-result" hidden></div><p id="save-message" role="status"></p></form></div></main></body></html>
