services:
  wallpaper:
    build: .
    image: boyweb-wallpaper:local
    container_name: boyweb-wallpaper
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8093:8080"
    volumes:
      - ./data:/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
